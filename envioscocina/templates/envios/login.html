<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f5f4f1; color: #1a1a18;
      min-height: 100vh; display: flex;
      align-items: center; justify-content: center;
    }
    .login-card {
      background: #fff; border: 0.5px solid rgba(0,0,0,.1);
      border-radius: 12px; padding: 32px 28px; width: 340px;
    }
    .login-title { font-size: 18px; font-weight: 500; margin-bottom: 6px; }
    .login-sub   { font-size: 13px; color: #6b6a65; margin-bottom: 24px; }
    label { font-size: 12px; color: #6b6a65; display: block; margin-bottom: 4px; }
    input {
      width: 100%; font-size: 13px; padding: 8px 10px;
      border: 0.5px solid rgba(0,0,0,.15); border-radius: 7px;
      background: #f5f4f1; color: #1a1a18; margin-bottom: 14px;
    }
    input:focus { outline: none; border-color: #1a1a18; }
    .btn-login {
      width: 100%; padding: 9px; font-size: 13px; font-weight: 500;
      background: #1a1a18; color: #fff; border: none;
      border-radius: 7px; cursor: pointer;
    }
    .btn-login:hover { opacity: .85; }
    .msg-error {
      background: #fcebeb; color: #a32d2d;
      border: 0.5px solid #a32d2d;
      border-radius: 7px; padding: 8px 12px;
      font-size: 13px; margin-bottom: 14px;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-title">Envíos Cocina</div>
    <div class="login-sub">Ingresá con tu usuario</div>

    {% if messages %}
      {% for msg in messages %}
        <div class="msg-error">{{ msg }}</div>
      {% endfor %}
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <label for="username">Usuario</label>
      <input type="text" id="username" name="username" autofocus autocomplete="username">

      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" autocomplete="current-password">

      <button class="btn-login" type="submit">Entrar</button>
    </form>
  </div>
</body>
</html>
